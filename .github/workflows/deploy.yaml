name: Desplegar microservicios en EKS (CI/CD)

on:
  push:
    branches: [ deploy ]
  workflow_dispatch:        # tambien se lanza a mano desde la pestana Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar el codigo del repo
        uses: actions/checkout@v4

      - name: 2. Configurar credenciales de AWS (temporales del lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 3. Login en Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 4. Construir y subir imagen a ECR
        env:
          REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          REPO: ${{ secrets.ECR_REPOSITORY }}
          SHA_TAG: ${{ github.sha }}
          VERSION_TAG: v1.0.0   # subir manualmente este numero en cada release relevante
        run: |
          docker build \
            -t "$REGISTRY/$REPO:$SHA_TAG" \
            -t "$REGISTRY/$REPO:latest" \
            -t "$REGISTRY/$REPO:$VERSION_TAG" \
            .
          docker push "$REGISTRY/$REPO:$SHA_TAG"
          docker push "$REGISTRY/$REPO:latest"
          docker push "$REGISTRY/$REPO:$VERSION_TAG"

      - name: 5. Instalar kubectl en el runner
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: 6. Conectar kubectl al cluster EKS
        run: |
          aws eks update-kubeconfig \
            --name "${{ secrets.EKS_CLUSTER_NAME }}" \
            --region "${{ secrets.AWS_REGION }}"

      - name: 7. Desplegar en EKS
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i \
            "s|<ACCOUNT_ID>|${{ secrets.AWS_ACCOUNT_ID }}|g; s|<REGION>|${{ secrets.AWS_REGION }}|g; s|:latest|:$IMAGE_TAG|g" \
            k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: 8. Esperar al rollout
        run: kubectl rollout status deployment/bonos-service --timeout=300s
